name: project11

on:
  pull_request:
    paths: ['project11/**', '.github/workflows/ci-project11.yml']
  push:
    branches: [main]
    paths: ['project11/**', '.github/workflows/ci-project11.yml']

jobs:
  check:
    name: project11 — Angular build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: project11/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx ng test --watch=false
