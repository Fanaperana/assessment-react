name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  project01:
    name: project01 — lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: project01/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
