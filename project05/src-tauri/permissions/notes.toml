[[permission]]
identifier = "main-commands"
description = "Main window note, notebook, import/export and timer operations."
commands.allow = [
  "list_notebooks", "create_notebook", "rename_notebook", "delete_notebook",
  "list_notes", "get_note", "create_note", "update_note", "trash_note",
  "restore_note", "empty_trash", "set_note_pinned", "set_note_tags",
  "list_tags", "search_notes", "import_markdown_files", "export_markdown",
  "get_timer_state", "start_timer", "stop_timer", "quit_app",
]

[[permission]]
identifier = "capture-note"
description = "Create an Inbox note, without reading the library or accessing files."
commands.allow = ["quick_capture"]
