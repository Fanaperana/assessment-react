name: project06

on:
  pull_request:
    paths: ['project06/**', '.github/workflows/ci-project06.yml']
  push:
    branches: [main]
    paths: ['project06/**', '.github/workflows/ci-project06.yml']

jobs:
  check:
    name: project06 — Astro build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project06
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: project06/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test --if-present
