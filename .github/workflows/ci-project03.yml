name: project03

on:
  pull_request:
    paths: ['project03/**', '.github/workflows/ci-project03.yml']
  push:
    branches: [main]
    paths: ['project03/**', '.github/workflows/ci-project03.yml']

jobs:
  check:
    name: project03 — Next.js lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project03
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: project03/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test --if-present
